name: Build
permissions:
  contents: read

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install PNPM
        run: sudo npm i -g pnpm@11.21.0

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm run build
