name: Build and Deploy
permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install PNPM
        run: sudo npm i -g pnpm@11.21.0

      - name: Install dependencies
        run: pnpm install

      - name: Build project
        run: pnpm run build

      - name: Prepare deployment artifact
        run: |
          pnpm --filter=urlate-v3l-game deploy ./deploy --legacy
          cp -r dist ./deploy/

      - name: Deploy
        run: |
          rsync -azq --delete \
            --exclude=/.git/ \
            --exclude='config/config.json' \
            $GITHUB_WORKSPACE/deploy/ URLATE-PRODUCTION:${{secrets.DEPLOY_TARGET}}/

      - name: Restart
        run: |
          ssh URLATE-PRODUCTION \
            "cd '${{secrets.DEPLOY_TARGET}}' && pm2 startOrReload ecosystem.config.js --update-env"
