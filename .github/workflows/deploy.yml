name: Build and Deploy
permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version-file: ".node-version"

      - name: Install dependencies
        uses: pnpm/setup@v2

      - name: Build project
        run: pnpm run build

      - name: Prepare deployment artifact
        run: |
          pnpm --filter=urlate-v3l-game deploy ./deploy --legacy --prod

      - name: Deploy
        run: |
          rsync -azq --delete \
            --exclude='config/config.json' \
            "$GITHUB_WORKSPACE/deploy/" URLATE-PRODUCTION:"${{secrets.DEPLOY_TARGET}}/"

      - name: Restart
        run: |
          ssh URLATE-PRODUCTION \
            "cd '${{secrets.DEPLOY_TARGET}}' && pm2 startOrReload ecosystem.config.js --update-env"
